services:
  iptv-updater:
    build: .
    container_name: iptv-updater
    restart: always
    ports:
      # 公网源扫描+测速 (app.py)
      - "5000:5000"
      # Web管理界面 + 本地源上传 (web_admin.py)
      - "9998:9998"
    environment:
      - TZ=Asia/Shanghai
      - CF_KV_TOKEN=75yITZFqUzs8XPEDhnrlWdpY
      - CF_UPLOAD_URL=https://iptv-bfo.pages.dev/api/upload
    volumes:
      - ./ZB.txt:/app/ZB.txt:ro
      - ./logs:/app/logs
      - ./custom_sources.json:/app/custom_sources.json:ro
