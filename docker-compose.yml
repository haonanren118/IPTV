version: '3.8'

services:
  iptv-updater:
    build: .
    container_name: iptv-updater
    restart: unless-stopped
    ports:
      # Web 管理界面
      - "9998:9998"
    environment:
      # CF Pages 上传地址
      - UPLOAD_URL=https://iptv-bfo.pages.dev/api/upload
      # CF Pages 上传认证 Token（需与 Cloudflare Dashboard 中设置的环境变量一致）
      - UPLOAD_TOKEN=your-upload-token-here
      # ZB.txt 文件路径（容器内）
      - ZB_FILE=/app/ZB.txt
      # EPG 节目单地址（可选，默认使用国内源）
      # - EPG_URL=https://epg.112114.xyz/pp.xml
    volumes:
      # 将 ZB.txt 挂载到容器内，方便更新
      - ./ZB.txt:/app/ZB.txt:ro
      # 自定义源持久化
      - ./custom_sources.json:/app/custom_sources.json
      # 日志持久化
      - ./logs:/app/logs
